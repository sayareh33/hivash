<article class="article-card">
  <a href="{{ article.get_absolute_url }}">
    {% if article.images.all %}
      <img src="{{ article.images.all.0.image.url }}" alt="{{ article.images.all.0.caption }}">
    {% endif %}
    <h3>{{ article.title }}</h3>
    <p class="excerpt">{{ article.excerpt }}</p>
  </a>
</article>
