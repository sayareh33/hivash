{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark fixed-top"
     style="background: linear-gradient(135deg, #00ff7f, #fff200); z-index:1000;">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center brand-link" href="{% url 'pages:home' %}">
            <span class="brand-title fw-bold">خانه</span>
            <img src="{% static 'img/hiva.png' %}" alt="خانه هیوا" class="brand-logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="باز کردن منو">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav mb-2 mb-lg-0 main-menu">
                <li class="nav-item"><a class="nav-link" href="{% url 'products:product_list' %}">محصولات</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'articles:list' %}">مقالات</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'charity:charity' %}">یاوران مهربان <span class="badge bg-warning"></span></a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'pages:aboutus' %}">درباره ما</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'pages:contactus' %}">تماس با ما</a></li>
            </ul>

            <div class="navbar-tools d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2">
                <div class="header-actions d-flex align-items-center gap-2">
                    <a href="{% url 'products:wishlist' %}" class="btn toolbar-btn" aria-label="علاقه‌مندی‌ها">
                        <i class="bi bi-heart"></i>
                    </a>
                    <a href="{% url 'carts:cart_detail' %}" class="btn toolbar-btn position-relative" aria-label="سبد خرید">
                        <i class="bi bi-cart3"></i>
                        <span class="navbar-cart-badge">{{ cart_count|default:0 }}</span>
                    </a>
                    <div class="dropdown">
                        <a href="#" class="btn toolbar-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            {% if user.is_authenticated %}
                                <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">حساب کاربری</a></li>
                                <li><a class="dropdown-item" href="{% url 'accounts:logout' %}">خروج</a></li>
                            {% else %}
                                <li><a class="dropdown-item" href="{% url 'accounts:login' %}">ورود</a></li>
                                <li><a class="dropdown-item" href="{% url 'accounts:signup' %}">ثبت‌نام</a></li>
                            {% endif %}
                        </ul>
                    </div>
                    <form action="{% url 'products:product_search' %}" method="get"
                          class="search-form d-flex align-items-center">
                        <input class="form-control rounded-pill me-2 search-input" type="search" placeholder="جستجو..."
                               name="q" value="{{ query }}">
                        <button class="btn search-btn" type="submit" aria-label="جستجو"><i class="bi bi-search"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
