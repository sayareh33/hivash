<!DOCTYPE html>
<html lang="fa" dir="rtl">
{% load static %}
{% load i18n %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم - خانه اشتغال</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://v1.fontapi.ir/css/Vazir" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #4CAF50;
            --primary-yellow: #FFC107;
            --primary-gradient: linear-gradient(135deg, var(--primary-green), var(--primary-yellow));
            --light-bg: #f8f9fc;
            --dark-text: #2c3e50;
            --border-radius: 10px;
            --box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
        }

        body {
            font-family: Vazir, "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-text);
            line-height: 1.6;
            font-size: 0.95rem;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23f8f9fc" width="100" height="100"/><path d="M0,0 L100,100 M20,0 L100,80 M0,20 L80,100" stroke="%23e9ecef" stroke-width="0.5"/></svg>');
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            background: var(--primary-gradient);
            color: white;
            padding: 1.8rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            top: -10px;
            right: -10px;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .auth-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -20px;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .auth-header h4 {
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .auth-header p {
            margin-bottom: 0;
            opacity: 0.95;
            position: relative;
            z-index: 1;
        }

        .auth-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark-text);
            font-size: 0.9rem;
        }

        .form-control {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            border: 1px solid #d1d3e2;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(76, 175, 80, 0.25);
        }

        .input-group-text {
            background: white;
            border: 1px solid #d1d3e2;
            border-left: none;
            padding: 0 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .input-group .form-control {
            border-right: none;
        }

        .input-group-text:hover {
            background-color: #f8f9fc;
        }

        .password-toggle {
            font-size: 1.1rem;
            color: var(--primary-green);
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            padding: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3d8b40, #e6ac00);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .form-check-input:checked {
            background-color: var(--primary-green);
            border-color: var(--primary-green);
        }

        .form-text a {
            color: var(--primary-green);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .form-text a:hover {
            color: #3d8b40;
            text-decoration: underline;
        }

        .auth-footer {
            text-align: center;
            padding: 1.5rem 2rem;
            border-top: 1px solid #e3e6f0;
            background: #f8f9fc;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .auth-footer a:hover {
            color: #3d8b40;
            text-decoration: underline;
        }

        .alert {
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
            margin-bottom: 1.5rem;
            border: none;
            font-size: 0.9rem;
        }

        .brand-text {
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 0.5rem;
            display: block;
            font-size: 1.1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-image {
            height: 50px;
            margin-left: 10px;
        }

        @media (max-width: 576px) {
            .auth-card {
                max-width: 100%;
            }

            .auth-header, .auth-body, .auth-footer {
                padding: 1.5rem;
            }

            .auth-header h4 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-container">
                    <span class="text-white fw-bold fs-4">{% trans "Business Home" %}</span>
                    <img src="{% static 'img/hiva.png' %}" class="logo-image" alt="لوگو خانه اشتغال">
                </div>
                <h4>{% trans "Enterance" %}</h4>
                <p></p>
            </div>

            <div class="auth-body">
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    <i class="bi bi-info-circle me-2"></i>
                    {% trans "Please enter you phone number and your password:" %}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="phone" class="form-label">{% trans "Phone Number" %}</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="09xxxxxxxxx" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">{% trans "Password" %}</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <span class="input-group-text" id="togglePassword">
                                <i class="bi bi-eye password-toggle"></i>
                            </span>
                        </div>
                        <div class="form-text mt-2">
                            <a href="#"><i class="bi bi-key me-1"></i>{% trans "?Do you forget your password" %}</a>
                        </div>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me" value="true">
                        <label class="form-check-label" for="remember_me">{% trans "Remember Me" %}</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-left me-2"></i>
                        {% trans "Entrance" %}
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p class="mb-0">{% trans "Not Have Account?" %} <a href="#"><i class="bi bi-person-plus me-1"></i>{% trans "Register" %}</a></p>
            </div>
        </div>
    </div>

    <script>
        // افزودن قابلیت نمایش/مخفی کردن رمز عبور
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
