{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>حذف آدرس</h2>
    <p>آیا مطمئن هستید که می‌خواهید آدرس "{{ object.title }}" را حذف کنید؟</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">حذف</button>
        <a href="{% url 'my_account' %}" class="btn btn-secondary">انصراف</a>
    </form>
</div>
{% endblock %}
