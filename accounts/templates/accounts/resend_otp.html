{% extends 'base.html' %}

{% block title %}ارسال مجدد کد تأیید - فروشگاه آنلاین{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h4 class="text-primary">ارسال مجدد کد تأیید</h4>
            <p class="text-muted">کد تأیید به شماره {{ request.session.signup_phone }} ارسال خواهد شد</p>
        </div>

        <div class="auth-body">
            <form id="resend-otp-form" method="post">
                {% csrf_token %}

                <button type="submit" class="btn btn-primary w-100 py-2 mb-3" id="resend-button">
                    ارسال مجدد کد تأیید
                </button>

                <div class="text-center">
                    <span class="countdown" id="countdown" style="display: none;"></span>
                </div>
            </form>

            <div id="message-container" class="mt-3"></div>
        </div>

        <div class="auth-footer">
            <p class="mb-0"><a href="{% url 'accounts:verify_otp' %}" class="text-primary">بازگشت به صفحه تأیید کد</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // مدیریت ارسال فرم
    $('#resend-otp-form').on('submit', function(e) {
        e.preventDefault();

        // غیرفعال کردن دکمه برای جلوگیری از کلیک‌های مکرر
        $('#resend-button').prop('disabled', true).text('در حال ارسال...');

        $.ajax({
            url: "{% url 'accounts:resend_otp' %}",
            method: 'POST',
            data: $(this).serialize(),
            success: function(response) {
                if (response.success) {
                    $('#message-container').html(
                        '<div class="alert alert-success">' + response.message + '</div>'
                    );

                    // شروع تایمر شمارش معکوس
                    startCountdown(120);
                } else {
                    $('#message-container').html(
                        '<div class="alert alert-danger">' + response.message + '</div>'
                    );
                    $('#resend-button').prop('disabled', false).text('ارسال مجدد کد تأیید');
                }
            },
            error: function() {
                $('#message-container').html(
                    '<div class="alert alert-danger">خطا در ارتباط با سرور</div>'
                );
                $('#resend-button').prop('disabled', false).text('ارسال مجدد کد تأیید');
            }
        });
    });

    // تایمر شمارش معکوس
    function startCountdown(seconds) {
        $('#resend-button').hide();
        $('#countdown').show();

        var countdown = seconds;
        var countdownElement = $('#countdown');

        var interval = setInterval(function() {
            var minutes = Math.floor(countdown / 60);
            var seconds = countdown % 60;

            countdownElement.text('ارسال مجدد پس از: ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds);

            if (--countdown < 0) {
                clearInterval(interval);
                $('#resend-button').show().prop('disabled', false).text('ارسال مجدد کد تأیید');
                $('#countdown').hide();
            }
        }, 1000);
    }

    // شروع تایمر در صورت نیاز
    {% if not user.can_resend_otp %}
    startCountdown({{ remaining_seconds }});
    {% endif %}
});
</script>
{% endblock %}
