<!-- Header Section -->
<header class="header-section">
    <div class="top-header py-2" style="background-color: #2c3e50;">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="header-info text-white">
                        <span class="me-3"><i class="fas fa-phone-alt me-2"></i> 09384501026</span>
                        <span><i class="fas fa-envelope me-2"></i> info@hiva-eshghal.ir</span>
                    </div>
                </div>
                <div class="col-md-6 text-end">
                    <div class="social-links">
                        <a href="#" class="text-white me-2"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="text-white me-2"><i class="fab fa-telegram"></i></a>
                        <a href="#" class="text-white me-2"><i class="fab fa-whatsapp"></i></a>
                        <a href="#" class="text-white"><i class="fab fa-linkedin"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-header py-3" style="background-color: white; box-shadow: 0 2px 15px rgba(0,0,0,0.1);">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-3 col-md-6 col-6">
                    <div class="logo-container">
                        <a href="{% url 'home' %}" class="d-flex align-items-center text-decoration-none">
                            <img src="{% static 'img/hiva.png' %}" alt="خانه اشتغال هیوا" class="img-fluid me-2" style="height: 50px;">
                            <span class="brand-name" style="font-weight: 700; color: #4CAF50; font-size: 1.3rem;">خانه اشتغال هیوا</span>
                        </a>
                    </div>
                </div>
                <div class="col-lg-6 col-md-12 col-12 mt-3 mt-md-0">
                    <div class="search-bar">
                        <form action="{% url 'products:product_search' %}" method="get" class="d-flex">
                            <input type="text" name="q" class="form-control rounded-0 rounded-start" placeholder="جستجوی محصولات..." aria-label="Search">
                            <button class="btn btn-success rounded-0 rounded-end" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-3 col-md-6 col-6 text-end">
                    <div class="header-actions d-flex justify-content-end align-items-center">
                        <a href="#" class="header-icon mx-2 position-relative">
                            <i class="fas fa-user-circle fs-4" style="color: #4CAF50;"></i>
                        </a>
                        <a href="#" class="header-icon mx-2 position-relative">
                            <i class="fas fa-heart fs-4" style="color: #4CAF50;"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                        </a>
                        <a href="#" class="header-icon mx-2 position-relative">
                            <i class="fas fa-shopping-cart fs-4" style="color: #4CAF50;"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">2</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
